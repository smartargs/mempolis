<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asset Lab</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <aside id="side">
    <div class="brand"><b>Asset Lab</b><span id="pack"></span></div>
    <nav id="list"></nav>
  </aside>
  <main>
    <header>
      <h1 id="title"></h1>
      <p id="driver"></p>
    </header>
    <section id="mapping" class="mapping" aria-label="What it represents"></section>
    <section class="controls" aria-label="View settings">
      <label>Time of day <input id="night" type="range" min="0" max="100" value="0"><span id="nightV"></span></label>
      <label>Decay <input id="decay" type="range" min="0" max="100" value="0"><span id="decayV"></span></label>
      <label>Rotation <input id="rot" type="range" min="0" max="345" step="15" value="0"><span id="rotV"></span></label>
      <div class="seg" role="group" aria-label="Region"><button data-region="mainland" aria-pressed="true">Mainland</button><button data-region="coast" aria-pressed="false">Coast</button></div>
      <div class="seg" role="group" aria-label="Zoom"><button data-lod="0" aria-pressed="true">Visit</button><button data-lod="1" aria-pressed="false">Street</button><button data-lod="2" aria-pressed="false">Neighbourhood</button><button data-lod="3" aria-pressed="false">Town</button></div>
      <label class="chk"><input id="anim" type="checkbox" checked> Animate</label>
    </section>
    <section id="variants" class="controls variants" aria-label="Variants" hidden></section>
    <section id="strip" class="strip" aria-label="Evolution strip"></section>
    <section class="zoomrow">
      <h2>All zoom levels</h2>
      <div id="zooms" class="zooms"></div>
    </section>
  </main>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
